name: Build and Release AK4 Digital Display

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-fedora-kde:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install Fedora Build Tools
        run: dnf install -y git gcc-c++ make rpm-build systemd-rpm-macros

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile Fedora Linux Binary
        run: |
          make
          mkdir -p release
          cp ak4_tray release/ak4_tray

      - name: Build Fedora RPM Package
        run: |
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp ak4_tray.cpp 99-ak4-display.rules ak4-display.desktop ak4-display.service ~/rpmbuild/SOURCES/
          rpmbuild -bb ak4-display.spec
          cp ~/rpmbuild/RPMS/x86_64/*.rpm release/

      - name: Upload Fedora Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ak4-display-fedora-linux
          path: |
            release/ak4_tray
            release/*.rpm
            99-ak4-display.rules
            ak4-display.desktop

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Compile Windows Binary
        shell: bash
        run: |
          g++ -O2 -std=c++17 -mwindows ak4_tray.cpp -o ak4_tray.exe -luser32 -lshell32 -lsetupapi -lhid -ldxgi -lpdh -s
          mkdir -p release
          cp ak4_tray.exe release/ak4_tray.exe

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ak4-display-windows
          path: release/ak4_tray.exe

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-fedora-kde, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ak4-display-fedora-linux/*
            artifacts/ak4-display-windows/*

